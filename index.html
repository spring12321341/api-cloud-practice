<html>
    <head>
        <title> мой первый API клиент</title>
    </head>
    <body>
        <h1>список пользователя из облака</h1>
        <button id="loadBnt">загрузить данные через API</button>
        <ul id="userList"></ul>

        <script>
            const  button = document.getElementById('loadBnt');
            const list = document.getElementById('userList');

            button.addEventListener('click', async () => {
                button.innerText = 'Загрузка...';


                const response = await fetch('https://pokeapi.co/api/v2/pokemon/pikachu');
                const data = await response.json();
                
                const listItem = document.createElement('li');
                listItem.innerHTML = `Имя: ${data.name}, Базовый вес: ${data.weight} кг`;
                list.appendChild(listItem);

                
                button.innerText = 'данные загружены!';
            })
        </script>
    </body>
</html>
